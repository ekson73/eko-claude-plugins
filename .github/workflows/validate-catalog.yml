name: validate-catalog
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Forbid agentic-tool / vendored trees
        run: |
          set -euo pipefail
          bad=0
          for d in skills agents commands mcp-tools; do
            if [ -d "$d" ]; then echo "FORBIDDEN: $d"; bad=1; fi
          done
          if [ -d plugins ] && find plugins -type f | grep -q .; then
            echo "FORBIDDEN: vendored plugins/"; bad=1
          fi
          exit $bad
      - name: Validate marketplace + catalog + hosts + RENAME_HOLD
        run: bash scripts/validate-catalog.sh
